    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mini CTF</title>
        <style>
            body {
                margin: 0;
                background: linear-gradient(135deg, #0f172a, #1e293b);
                color: white;
                font-family: Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            .card {
                text-align: center;
                background: rgba(255,255,255,0.08);
                padding: 40px;
                border-radius: 15px;
                backdrop-filter: blur(10px);
                box-shadow: 0 0 20px rgba(0,0,0,.4);
            }

            h1 {
                color: #38bdf8;
            }

            p {
                color: #cbd5e1;
            }

            button {
                margin-top: 20px;
                padding: 10px 25px;
                border: none;
                border-radius: 8px;
                background: #38bdf8;
                color: white;
                cursor: pointer;
                font-size: 16px;
            }

            button:hover {
                background: #0ea5e9;
            }
        </style>
    </head>
    <body>

    <!--
        Félicitations !
        Tu as trouvé le flag.

        FLAG{Inspecter_Le_Code_Source}
    -->

    <div class="card">
        <h1>🔐 Mini CTF</h1>
        <p>Le flag est caché quelque part sur cette page...</p>
        <button onclick="alert('Tu cherches au bon endroit ? 😉')">
            Chercher le flag
        </button>
    </div>

    </body>
